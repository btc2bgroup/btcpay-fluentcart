name: Deploy to WordPress.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to deploy (blank = the branch you dispatch from)'
        required: false

jobs:
  deploy:
    name: Push release to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve and verify version
        id: version
        run: |
          HEADER_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9.]+' bitcoin-payments-for-fluentcart.php)
          CONST_VERSION=$(grep -oP "define\('BTCPAY_FCT_VERSION',\s*'\K[0-9.]+" bitcoin-payments-for-fluentcart.php)
          STABLE_TAG=$(grep -oP '^Stable tag:\s*\K[0-9.]+' readme.txt)

          echo "Plugin header: $HEADER_VERSION, constant: $CONST_VERSION, readme stable tag: $STABLE_TAG"

          if [ "$HEADER_VERSION" != "$STABLE_TAG" ] || [ "$CONST_VERSION" != "$STABLE_TAG" ]; then
            echo "::error::Version mismatch in the checked-out tree - header=$HEADER_VERSION const=$CONST_VERSION stable tag=$STABLE_TAG."
            exit 1
          fi

          # On a release, the git tag must agree with the files it points at.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$TAG_VERSION" != "$STABLE_TAG" ]; then
              echo "::error::Release tag $TAG_VERSION does not match the plugin version $STABLE_TAG."
              exit 1
            fi
          fi

          # The deploy action falls back to .gitattributes (shipping tests/, bin/, composer files)
          # if .distignore is absent - which is what happens when deploying a tag cut before it.
          if [ ! -f .distignore ]; then
            echo "::error::.distignore is missing from this ref - deploy a ref that contains it."
            exit 1
          fi

          echo "version=$STABLE_TAG" >> "$GITHUB_OUTPUT"

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: bitcoin-payments-for-fluentcart
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS_DIR: .wordpress-org

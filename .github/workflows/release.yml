name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check tag matches plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          HEADER_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9.]+' btcpay-for-fluent-cart.php)
          CONST_VERSION=$(grep -oP "define\('BTCPAY_FCT_VERSION',\s*'\K[0-9.]+" btcpay-for-fluent-cart.php)
          STABLE_TAG=$(grep -oP '^- \*\*Stable tag:\s*\K[0-9.]+' README.md)

          echo "Plugin header: $HEADER_VERSION, constant: $CONST_VERSION, readme stable tag: $STABLE_TAG"

          if [ "$HEADER_VERSION" != "$TAG_VERSION" ] || [ "$CONST_VERSION" != "$TAG_VERSION" ] || [ "$STABLE_TAG" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch - bump the plugin header, BTCPAY_FCT_VERSION and README.md 'Stable tag' to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Run tests
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          ./vendor/bin/phpunit

      - name: Build plugin zip
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/btcpay-for-fluent-cart
          cp btcpay-for-fluent-cart.php README.md dist/btcpay-for-fluent-cart/
          cp -R includes assets dist/btcpay-for-fluent-cart/
          cd dist
          zip -rq "btcpay-for-fluent-cart-${TAG_VERSION}.zip" btcpay-for-fluent-cart
          unzip -l "btcpay-for-fluent-cart-${TAG_VERSION}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/btcpay-for-fluent-cart-${TAG_VERSION}.zip" \
            --title "BTCPay Server for FluentCart ${TAG_VERSION}" \
            --generate-notes
